[workspace]
resolver = "2"
members = ["crates/wr-core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ChefDavid0815/worktree-rescue"
authors = ["ChefDavid0815"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"
